name: Build and publish wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CTRANSLATE2_VERSION: "4.7.1.post1"

jobs:
  build-cuda-wheel:
    name: "Build CUDA wheel (Linux x86_64)"
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake g++ git python3 python3-pip python3-dev python3-venv \
            libopenblas-dev wget patchelf
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Build C++ library
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CUDA=ON \
            -DWITH_CUDNN=ON \
            -DOPENSSL_ROOT_DIR=/usr \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          make install
          ldconfig

      - name: Build Python wheel
        working-directory: python
        run: |
          pip install pybind11==2.11.1 auditwheel
          CTRANSLATE2_ROOT=/usr/local python3 setup.py bdist_wheel
          # Bundle shared libs into the wheel
          auditwheel repair dist/*.whl \
            --plat manylinux_2_35_x86_64 \
            -w dist/repaired/
          ls -la dist/repaired/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-wheel
          path: python/dist/repaired/*.whl

  build-cpu-wheel:
    name: "Build CPU wheel (Linux x86_64)"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake g++ libopenblas-dev patchelf
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Build C++ library
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CUDA=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build Python wheel
        working-directory: python
        run: |
          pip install pybind11==2.11.1 auditwheel
          CTRANSLATE2_ROOT=/usr/local python3 setup.py bdist_wheel
          auditwheel repair dist/*.whl \
            --plat manylinux_2_35_x86_64 \
            -w dist/repaired/
          ls -la dist/repaired/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheel
          path: python/dist/repaired/*.whl

  publish:
    name: Publish to GitHub Release & PyPI
    needs: [build-cuda-wheel, build-cpu-wheel]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
