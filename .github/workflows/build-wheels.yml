name: Build and publish wheels

# Release pipeline for the ctranslate2-crisperwhisper fork.
#
# Reuses upstream's cibuildwheel recipe (python/tools/prepare_build_environment_linux.sh):
# manylinux_2_28 container, CUDA 12.8 with CUDA_DYNAMIC_LOADING=ON (libcublas is
# dlopen'd at runtime, so wheels stay small and also run on CPU-only machines)
# and CUDA_ARCH_LIST="Common" (sm_50..sm_90 + PTX forward-compat for newer GPUs).
# One wheel per CPython version, Linux x86_64.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — configure the publisher on
# https://pypi.org/manage/account/publishing/ for project
# "ctranslate2-crisperwhisper", repo "nyrahealth/CTranslate2", workflow
# "build-wheels.yml", environment "pypi" (works pre-registration as a
# "pending publisher" for the first upload).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels (Linux x86_64, CUDA)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: python
          output-dir: python/wheelhouse
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: CIBW_ARCHS
          CIBW_BEFORE_ALL_LINUX: python/tools/prepare_build_environment_linux.sh
          CIBW_BEFORE_BUILD: pip install -r python/install_requirements.txt
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS: x86_64
          # CPython only; crisperwhisper needs >=3.10 but the fork itself
          # follows upstream's >=3.9.
          CIBW_SKIP: "pp* *-musllinux_*"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: python/wheelhouse/*.whl

  smoke-test:
    name: Smoke test (fork APIs present)
    needs: [build-wheels]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Install wheel on a clean machine
        run: |
          pip install dist/*cp$(python -c 'import sys; print("%d%d" % sys.version_info[:2])')*manylinux*.whl

      # Guards against re-publishing a build without the CrisperWhisper
      # speculative/dual decoding APIs (the 4.7.1.post1 mistake).
      - name: Verify fork APIs
        run: |
          python - <<'EOF'
          import ctranslate2

          print("version:", ctranslate2.__version__)
          whisper = ctranslate2.models.Whisper
          required = (
              "prefill",
              "forward_step_greedy",
              "forward_batch_greedy",
              "generate_dual_greedy",
          )
          missing = [m for m in required if not hasattr(whisper, m)]
          assert not missing, f"wheel is missing fork APIs: {missing}"
          print("fork APIs present:", ", ".join(required))
          EOF

  publish:
    name: Publish to GitHub Release & PyPI
    needs: [build-wheels, smoke-test]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

      # Trusted Publishing: no token, authenticated via the job's OIDC
      # identity + the "pypi" environment. Wheels only — no sdist, a source
      # build without the prebuilt C++ library fails confusingly (upstream
      # publishes no sdist either).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
